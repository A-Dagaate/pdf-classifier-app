# Production profile — activated via SPRING_PROFILES_ACTIVE=prod
#
# This file intentionally lists ONLY genuine overrides to the base
# application.properties. Duplicating unchanged keys here (as the old
# Railway-era version did with things like app.totp.issuer or the JWT
# expiration) just recreates the "two sources of truth" trap we hit
# earlier — if a key doesn't change between environments, it belongs
# in the base file only.

# --- Database (Postgres) ---
# Uses discrete connection fields (host/port/name/user/password)
# rather than a single DATABASE_URL. Reason: Render's Postgres
# connection string comes as postgres://user:pass@host:port/db,
# which is NOT directly JDBC-compatible (Spring needs
# jdbc:postgresql://...) — this sidesteps that mismatch entirely.
# Render also exposes these same fields individually, which we'll
# wire up in Phase 5.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Spring Batch's schema tables aren't auto-created on Postgres the
# way they are on embedded H2 by default — this forces creation.
# (This is the fix for the startup crash we chased down in Phase 3.)
spring.batch.jdbc.initialize-schema=always

# --- Email ---
# Override host/port too, not just credentials — keeps this flexible
# if the provider ever changes from Gmail to something like SendGrid.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

# --- Behind a TLS-terminating proxy ---
# Railway (and Render) terminate TLS at the edge and forward plain HTTP to the
# container. Without this, Spring builds absolute redirects with scheme http://,
# so a login redirect sends the browser to http://host/dashboard and relies on
# the edge to upgrade it. Honouring X-Forwarded-Proto/Host fixes the scheme.
server.forward-headers-strategy=framework

# --- Hardening ---
spring.thymeleaf.cache=true
logging.level.com.example.pdfclassifier=INFO
logging.level.org.springframework.security=WARN

# Once a real Gmail App Password (or a transactional email API) is
# wired up, consider re-enabling mail health monitoring so a broken
# mail service actually surfaces as DOWN in production rather than
# being silently excluded:
# management.health.mail.enabled=true

