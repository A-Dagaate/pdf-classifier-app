# Server Configuration
server.port=${PORT:8080}
#server.servlet.context-path=/pdf-classifier

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:pdfclassifier;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Email Configuration (Gmail example - update with your credentials)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application specific
app.upload.dir=./uploads
app.processed.dir=./processed
app.jwt.secret=${JWT_SECRET:yourSecretKeyForJWTTokenGenerationMustBeLongEnough}
app.jwt.expiration=86400000
app.totp.issuer=PDFClassifier
spring.batch.job.enabled=false
app.ml.service.base-url=http://localhost:8000


management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.com.example.pdfclassifier=DEBUG
logging.level.org.springframework.security=DEBUG
