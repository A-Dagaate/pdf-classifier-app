services:
  pdf-classifier:
    build: .
    container_name: pdf-classifier-app
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
      - processed_data:/app/processed
    environment:
      # Override upload/processed paths to use volume mount points
      - APP_UPLOAD_DIR=/app/uploads
      - APP_PROCESSED_DIR=/app/processed
      # JWT — override in production
      - APP_JWT_SECRET=${JWT_SECRET:-devSecretKeyForLocalDockerMustBeLongEnough123}
      # Email — set real credentials via .env file for email features
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD:-}
      # Disable Thymeleaf cache in dev
      - SPRING_THYMELEAF_CACHE=false
      # Reach the classifier by compose service name — "localhost" inside this
      # container would point at the container itself, not the sibling service
      - APP_ML_SERVICE_BASE_URL=http://ml-service:8000
    depends_on:
      ml-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # context-path is commented out in application.properties, so the app
      # now serves at the root. Actuator health is the right probe anyway.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ml-service:
    build: ./ml_service
    container_name: pdf-ml-service
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ste-study:
    build: ./ste_sidecar
    container_name: ste-study-api
    ports:
      - "8001:8001"
    volumes:
      - ste_chroma_data:/app/chroma_db
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  uploads_data:
  processed_data:
  ste_chroma_data:
